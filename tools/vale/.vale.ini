StylesPath = styles
MinAlertLevel = suggestion
Vocab = StopSlop

[*.{md,markdown,txt}]
BasedOnStyles = StopSlop
# Quoted source material and code-formatted patterns are citations, not our prose.
# This is what lets a catalog list the phrases it bans without tripping its own rules.
# NOTE: Vale splits these values on commas, so never use a {n,m} quantifier here.
BlockIgnores = (?m)^> .*$, (?s)```.*?```, (?m)^\|.*\|$
TokenIgnores = (`[^`]+`), ("[^"\n]+"), (\*\*[^*\n]+\*\*)

[*.html]
BasedOnStyles = StopSlop
# <div class="quote"> and <blockquote> carry verbatim source quotes.
BlockIgnores = (?s)<div class="quote">.*?</div>, (?s)<blockquote[^>]*>.*?</blockquote>
